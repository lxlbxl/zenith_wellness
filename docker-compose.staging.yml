services:
  zenith-mysql:
    image: mysql:8.0
    container_name: zenith-mysql-staging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zenith_staging_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zenith_wellness}
      MYSQL_USER: ${MYSQL_USER:-zenith}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zenith_staging_pass}
    volumes:
      - zenith_mysql_data:/var/lib/mysql
    networks:
      - zenith-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  zenith-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: zenith-wellness-backend:staging
    container_name: zenith-backend-staging
    restart: unless-stopped
    depends_on:
      zenith-mysql:
        condition: service_healthy
    environment:
      APP_ENV: staging
      APP_URL: ${APP_URL:-https://staging.zenithwellness.club}
      APP_DEBUG: "false"
      PRODUCTION: "true"
      DB_HOST: zenith-mysql
      DB_NAME: ${MYSQL_DATABASE:-zenith_wellness}
      DB_USER: ${MYSQL_USER:-zenith}
      DB_PASS: ${MYSQL_PASSWORD:-zenith_staging_pass}
      JWT_SECRET: ${JWT_SECRET:-staging-jwt-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-staging-enc-key-change-me}
      ACTIVE_PAYMENT_GATEWAY: ${ACTIVE_PAYMENT_GATEWAY:-stripe}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.zenithwellness.club}
      SALES_ENABLED: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    networks:
      - zenith-network

  zenith-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: zenith-wellness-frontend:staging
    container_name: zenith-frontend-staging
    restart: unless-stopped
    depends_on:
      - zenith-backend
    networks:
      - zenith-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zenith-staging.rule=Host(`staging.zenithwellness.club`)"
      - "traefik.http.routers.zenith-staging.entrypoints=https"
      - "traefik.http.routers.zenith-staging.tls=true"
      - "traefik.http.routers.zenith-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.zenith-staging.loadbalancer.server.port=80"
      - "traefik.http.routers.zenith-staging-http.rule=Host(`staging.zenithwellness.club`)"
      - "traefik.http.routers.zenith-staging-http.entrypoints=http"
      - "traefik.http.routers.zenith-staging-http.middlewares=zenith-https-redirect"
      - "traefik.http.middlewares.zenith-https-redirect.redirectscheme.scheme=https"

networks:
  zenith-network:
    driver: bridge
  coolify:
    external: true

volumes:
  zenith_mysql_data:
